<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BraveSaver promo 440x280</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 440px; height: 280px; overflow: hidden; }
      .tile {
        width: 440px;
        height: 280px;
        background:
          radial-gradient(80% 80% at 100% 0%, rgba(196,132,74,.28), transparent 50%),
          #16130f;
        color: #ede4d4;
        font-family: "Bahnschrift Condensed", "Segoe UI", sans-serif;
        padding: 28px 28px 24px;
      }
      .kicker { color: #c4844a; letter-spacing: .22em; text-transform: uppercase; font-size: 12px; }
      h1 { font-size: 42px; font-weight: 600; margin: 8px 0 10px; }
      p { color: #a89a88; font-size: 18px; max-width: 18ch; line-height: 1.3; font-family: "Segoe UI", sans-serif; }
      svg { position: absolute; right: 18px; bottom: 10px; width: 180px; opacity: .95; }
      .wrap { position: relative; width: 440px; height: 280px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="tile">
        <p class="kicker">Load cell</p>
        <h1>BraveSaver</h1>
        <p>Park idle tabs. Free RAM.</p>
        <svg viewBox="0 0 180 90" aria-hidden="true">
          <path d="M8 70 C 40 10, 80 10, 110 50 S 150 90, 172 28" fill="none" stroke="#c4844a" stroke-width="6" stroke-linecap="round"/>
          <circle cx="110" cy="28" r="7" fill="#f0c070"/>
        </svg>
      </div>
    </div>
  </body>
</html>
